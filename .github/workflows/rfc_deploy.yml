on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

name: Verify Cloudflare Pages build

# NOTE: This workflow no longer deploys anything.
#
# https://rfc.tari.com is served by a Cloudflare Pages project ("rfcs", in the
# "Tari and Yat" Cloudflare account) connected directly to this repo. Cloudflare
# builds and publishes on every push to `main` — GitHub Actions is NOT in the
# publish path. (The old job here pushed a build to the gh-pages branch for
# GitHub Pages, which was retired in 2024 and served nothing.)
#
# What this job does now: run the EXACT same build Cloudflare runs
# (scripts/build.sh), so if a change would break the real deploy, CI goes red
# immediately instead of the site silently freezing. See DEPLOYMENT.md.

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Build the book the same way Cloudflare Pages does 🛠
        run: bash scripts/build.sh
