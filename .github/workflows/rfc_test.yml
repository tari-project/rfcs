on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

name: Test RFC Docs

# Builds the book via the canonical scripts/build.sh (the same recipe Cloudflare
# Pages uses to publish rfc.tari.com), then additionally runs `mdbook test` to
# compile the rust code samples in the docs. Reusing the script keeps the mdBook
# version single-sourced — see DEPLOYMENT.md.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Build the book (same recipe as Cloudflare Pages) 🛠
        run: bash scripts/build.sh

      - name: Test rust code samples 🧪
        run: |
          export PATH="$PWD/.build-tools:$PATH"
          mdbook test
